schema_version: 1

context:
  name: langchain-chroma
  version: 1.2.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langchain_chroma-${{ version }}.tar.gz
  sha256: 609c8b554ce9d11e99db8520fed021c5dbbcf525bd6ae04707a87d0147d142fa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<4.0.0
    - langchain-core >=1.4.7,<2.0.0
    - chromadb >=1.5.5
    - numpy >=1.26.0
tests:
  - python:
      imports:
        - langchain_chroma
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An integration package connecting Chroma and LangChain
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/langchain-ai/langchain

extra:
  recipe-maintainers:
    - jan-janssen
